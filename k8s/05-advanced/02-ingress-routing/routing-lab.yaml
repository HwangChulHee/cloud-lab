apiVersion: v1
kind: Namespace
metadata:
  name: lab-self-edge
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping
  namespace: lab-self-edge
spec:
  replicas: 1
  selector:
    matchLabels: {app: shopping}
  template:
    metadata:
      labels: {app: shopping}
    spec:
      containers:
      - name: web
        image: hashicorp/http-echo:1.0.0
        args: ["-listen=:5678", "-text=shopping"]
        ports:
        - containerPort: 5678
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer
  namespace: lab-self-edge
spec:
  replicas: 1
  selector:
    matchLabels: {app: customer}
  template:
    metadata:
      labels: {app: customer}
    spec:
      containers:
      - name: web
        image: hashicorp/http-echo:1.0.0
        args: ["-listen=:5678", "-text=customer"]
        ports:
        - containerPort: 5678
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: shopping
  namespace: lab-self-edge
spec:
  selector: {app: shopping}
  ports:
  - port: 80
    targetPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: customer
  namespace: lab-self-edge
spec:
  selector: {app: customer}
  ports:
  - port: 80
    targetPort: 5678
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop-routes
  namespace: lab-self-edge
spec:
  ingressClassName: lab-traefik
  rules:
  - host: shop.study.local
    http:
      paths:
      - path: /shopping
        pathType: Prefix
        backend:
          service:
            name: shopping
            port: {number: 80}
      - path: /customer
        pathType: Prefix
        backend:
          service:
            name: customer
            port: {number: 80}
  - host: customer.study.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: customer
            port: {number: 80}
