apiVersion: v1
kind: Pod
metadata:
  name: load
  namespace: lab-hpa
spec:
  restartPolicy: Never
  containers:
  - name: load
    image: busybox:1.37
    command: ["sh", "-c"]
    args:
    - while true; do wget -q -O- http://php-apache >/dev/null; sleep 0.01; done
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {cpu: 200m, memory: 64Mi}
