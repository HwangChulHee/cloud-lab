apiVersion: v1
kind: Namespace
metadata:
  name: lab-dynamic-storage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: lab-dynamic-storage
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: reader
  namespace: lab-dynamic-storage
spec:
  containers:
  - name: app
    image: busybox:1.37
    command: ["sleep", "3600"]
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: data
