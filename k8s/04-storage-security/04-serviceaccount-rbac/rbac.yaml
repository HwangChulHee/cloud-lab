apiVersion: v1
kind: Namespace
metadata:
  name: lab-rbac
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reader
  namespace: lab-rbac
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: lab-rbac
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader
  namespace: lab-rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-reader
subjects:
- kind: ServiceAccount
  name: reader
  namespace: lab-rbac
---
apiVersion: v1
kind: Pod
metadata:
  name: example
  namespace: lab-rbac
spec:
  containers:
  - name: app
    image: busybox:1.37
    command: ["sleep", "3600"]
