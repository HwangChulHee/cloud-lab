apiVersion: v1
kind: Pod
metadata:
  name: config-reader
  namespace: lab-self-config
spec:
  containers:
  - name: app
    image: busybox:1.37
    command:
    - sh
    - -c
    - sleep 3600
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
    env:
    - name: MODE
      valueFrom:
        configMapKeyRef:
          name: settings
          key: mode
    - name: LAB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: credentials
          key: password
    volumeMounts:
    - name: config
      mountPath: /config
    - name: config
      mountPath: /fixed/mode
      subPath: mode
    - name: secret
      mountPath: /credentials
      readOnly: true
  volumes:
  - name: config
    configMap:
      name: settings
  - name: secret
    secret:
      secretName: credentials
