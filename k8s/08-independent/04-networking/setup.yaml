apiVersion: v1
kind: Namespace
metadata:
  name: lab-self-network
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lab-self-network
spec:
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: nginx:1.28-alpine
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
  replicas: 1
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: lab-self-network
spec:
  selector:
    app: web
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: lab-self-network
spec:
  containers:
  - name: app
    image: busybox:1.37
    command:
    - sh
    - -c
    - sleep 3600
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: named
  namespace: lab-self-network
  labels:
    app: named
spec:
  containers:
  - name: app
    image: busybox:1.37
    command:
    - sh
    - -c
    - sleep 3600
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
  hostname: named
  subdomain: headless
---
apiVersion: v1
kind: Service
metadata:
  name: headless
  namespace: lab-self-network
spec:
  selector:
    app: named
  ports:
  - port: 80
    targetPort: 80
  clusterIP: None
---
apiVersion: v1
kind: Service
metadata:
  name: outside
  namespace: lab-self-network
spec:
  type: ExternalName
  externalName: example.com
---
apiVersion: v1
kind: Service
metadata:
  name: manual
  namespace: lab-self-network
spec:
  ports:
  - port: 80
    targetPort: 80
    name: http
