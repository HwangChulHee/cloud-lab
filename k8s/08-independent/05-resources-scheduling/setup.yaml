apiVersion: v1
kind: Namespace
metadata:
  name: lab-self-placement
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: health
  namespace: lab-self-placement
spec:
  selector:
    matchLabels:
      app: health
  template:
    metadata:
      labels:
        app: health
    spec:
      containers:
      - name: web
        image: nginx:1.28-alpine
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        command:
        - sh
        - -c
        - touch /tmp/live /tmp/ready; exec nginx -g "daemon off;"
        readinessProbe:
          exec:
            command:
            - test
            - -f
            - /tmp/ready
          periodSeconds: 3
        livenessProbe:
          exec:
            command:
            - test
            - -f
            - /tmp/live
          periodSeconds: 3
          failureThreshold: 2
        startupProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 2
          failureThreshold: 30
  replicas: 1
---
apiVersion: v1
kind: Service
metadata:
  name: health
  namespace: lab-self-placement
spec:
  selector:
    app: health
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: best
  namespace: lab-self-placement
spec:
  containers:
  - name: app
    image: busybox:1.37
    command:
    - sh
    - -c
    - sleep 3600
---
apiVersion: v1
kind: Pod
metadata:
  name: burst
  namespace: lab-self-placement
spec:
  containers:
  - name: app
    image: busybox:1.37
    command:
    - sh
    - -c
    - sleep 3600
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: guaranteed
  namespace: lab-self-placement
spec:
  containers:
  - name: app
    image: busybox:1.37
    command:
    - sh
    - -c
    - sleep 3600
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 32Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: place
  namespace: lab-self-placement
spec:
  selector:
    matchLabels:
      app: place
  template:
    metadata:
      labels:
        app: place
    spec:
      containers:
      - name: app
        image: busybox:1.37
        command:
        - sh
        - -c
        - sleep 3600
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - REPLACE_WORKER_HOSTNAME
  replicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spread
  namespace: lab-self-placement
spec:
  selector:
    matchLabels:
      app: spread
  template:
    metadata:
      labels:
        app: spread
    spec:
      containers:
      - name: app
        image: busybox:1.37
        command:
        - sh
        - -c
        - sleep 3600
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: spread
            topologyKey: kubernetes.io/hostname
  replicas: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: near
  namespace: lab-self-placement
spec:
  replicas: 1
  selector:
    matchLabels:
      app: near
  template:
    metadata:
      labels:
        app: near
    spec:
      containers:
      - name: app
        image: busybox:1.37
        command:
        - sleep
        - '3600'
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: place
            topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Pod
metadata:
  name: finished
  namespace: lab-self-placement
spec:
  restartPolicy: Never
  containers:
  - name: app
    image: busybox:1.37
    command:
    - sh
    - -c
    - echo complete-ok
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: crash
  namespace: lab-self-placement
spec:
  restartPolicy: Always
  containers:
  - name: app
    image: busybox:1.37
    command:
    - sh
    - -c
    - exit 1
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
