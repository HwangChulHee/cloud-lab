apiVersion: v1
kind: Namespace
metadata:
  name: lab-self-security
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reader
  namespace: lab-self-security
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: lab-self-security
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader
  namespace: lab-self-security
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-reader
subjects:
- kind: ServiceAccount
  name: reader
  namespace: lab-self-security
---
apiVersion: v1
kind: Pod
metadata:
  name: example
  namespace: lab-self-security
spec:
  containers:
  - name: app
    image: busybox:1.37
    command:
    - sh
    - -c
    - sleep 3600
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
