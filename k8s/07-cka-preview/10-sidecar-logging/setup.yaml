apiVersion: v1
kind: Namespace
metadata:
  name: preview-logging
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy
  namespace: preview-logging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: legacy
  template:
    metadata:
      labels:
        app: legacy
    spec:
      containers:
      - name: legacy
        image: busybox:1.37
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            memory: 128Mi
        command:
        - sh
        - -c
        - mkdir -p /var/log; while true; do date >> /var/log/legacy.log; sleep 2;
          done
