apiVersion: v1
kind: Namespace
metadata:
  name: preview-priority
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: preview-reference
value: 900100
globalDefault: false
description: Preview reference class; no system classes involved
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: preview-low
value: 1000
globalDefault: false
description: Preview reference class; no system classes involved
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logger
  namespace: preview-priority
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logger
  template:
    metadata:
      labels:
        app: logger
    spec:
      containers:
      - name: logger
        image: busybox:1.37
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            memory: 128Mi
        command:
        - sh
        - -c
        - while true; do date; sleep 5; done
