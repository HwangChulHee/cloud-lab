apiVersion: apps/v1
kind: Deployment
metadata:
  name: writer
  namespace: preview-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: writer
  template:
    metadata:
      labels:
        app: writer
    spec:
      containers:
      - name: writer
        image: busybox:1.37
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            memory: 128Mi
        command:
        - sh
        - -c
        - test -f /data/message || echo "saved-before-recovery" > /data/message; sleep
          86400
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data
