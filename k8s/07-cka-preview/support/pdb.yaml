apiVersion: v1
kind: Namespace
metadata:
  name: preview-disruption
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: preview-disruption
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: nginx:1.28-alpine
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 2
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  namespace: preview-disruption
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: web
