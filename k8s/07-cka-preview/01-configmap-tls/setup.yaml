apiVersion: v1
kind: Namespace
metadata:
  name: preview-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: preview-config
data:
  nginx.conf: "events {}\nhttp {\n  server {\n    listen 443 ssl;\n    ssl_certificate\
    \ /etc/nginx/tls/tls.crt;\n    ssl_certificate_key /etc/nginx/tls/tls.key;\n \
    \   ssl_protocols TLSv1.3;\n    location / { return 200 \"preview tls ok\\n\"\
    ; }\n  }\n}\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: preview-config
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: nginx:1.28-alpine
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            memory: 128Mi
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: tls
          mountPath: /etc/nginx/tls
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: nginx-config
      - name: tls
        secret:
          secretName: web-tls
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: preview-config
spec:
  selector:
    app: web
  ports:
  - port: 443
    targetPort: 443
