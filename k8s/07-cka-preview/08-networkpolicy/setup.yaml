apiVersion: v1
kind: Namespace
metadata:
  name: preview-frontend
---
apiVersion: v1
kind: Namespace
metadata:
  name: preview-backend
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend
  namespace: preview-frontend
  labels:
    app: frontend
spec:
  containers:
  - name: client
    image: busybox:1.37
    command:
    - sleep
    - '86400'
---
apiVersion: v1
kind: Pod
metadata:
  name: other
  namespace: preview-frontend
  labels:
    app: other
spec:
  containers:
  - name: client
    image: busybox:1.37
    command:
    - sleep
    - '86400'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: preview-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: nginx:1.28-alpine
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: preview-backend
spec:
  selector:
    app: backend
  ports:
  - port: 80
    targetPort: 80
