apiVersion: v1
kind: Namespace
metadata:
  name: preview-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: preview-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: nginx:1.28-alpine
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: preview-gateway
spec:
  selector:
    app: web
  ports:
  - port: 80
    targetPort: 80
