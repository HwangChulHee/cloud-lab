apiVersion: v1
kind: Pod
metadata:
  name: config-reader
  namespace: lab-self-config
spec:
  containers:
  - name: app
    image: busybox:1.37
    command: ["sh", "-c", "sleep 3600"]
    env:
    - name: MODE
      valueFrom:
        configMapKeyRef:
          name: settings
          key: mode
    volumeMounts:
    - name: config
      mountPath: /config
    - name: config
      mountPath: /fixed/mode
      subPath: mode
  volumes:
  - name: config
    configMap:
      name: settings
