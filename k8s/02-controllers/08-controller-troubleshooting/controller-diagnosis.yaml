apiVersion: v1
kind: Namespace
metadata:
  name: lab-controller-diagnosis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lab-controller-diagnosis
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
      - name: web
        image: nginx:1.28-alpine
        readinessProbe:
          httpGet: {path: /, port: 80}
          periodSeconds: 3
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: completed
  namespace: lab-controller-diagnosis
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: worker
        image: busybox:1.37
        command: ["sh", "-c", "echo success"]
