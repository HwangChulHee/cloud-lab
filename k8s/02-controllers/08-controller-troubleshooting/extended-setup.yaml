apiVersion: v1
kind: Namespace
metadata:
  name: lab-self-control
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lab-self-control
spec:
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: nginx:1.28-alpine
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
  replicas: 2
---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: direct-rs
  namespace: lab-self-control
spec:
  selector:
    matchLabels:
      app: direct-rs
  template:
    metadata:
      labels:
        app: direct-rs
    spec:
      containers:
      - name: web
        image: nginx:1.28-alpine
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
  replicas: 1
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: agent
  namespace: lab-self-control
spec:
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      containers:
      - name: app
        image: busybox:1.37
        command:
        - sh
        - -c
        - sleep 3600
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: batch
  namespace: lab-self-control
spec:
  completions: 3
  parallelism: 2
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: app
        image: busybox:1.37
        command:
        - sh
        - -c
        - echo job-ok; sleep 3
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: clock
  namespace: lab-self-control
spec:
  schedule: '*/1 * * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: app
            image: busybox:1.37
            command:
            - sh
            - -c
            - date; sleep 5
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                cpu: 100m
                memory: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blue
  namespace: lab-self-control
spec:
  selector:
    matchLabels:
      app: blue
  template:
    metadata:
      labels:
        app: blue
    spec:
      containers:
      - name: web
        image: busybox:1.37
        command:
        - sh
        - -c
        - mkdir -p /www; echo blue > /www/index.html; exec httpd -f -p 80 -h /www
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
  replicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: green
  namespace: lab-self-control
spec:
  selector:
    matchLabels:
      app: green
  template:
    metadata:
      labels:
        app: green
    spec:
      containers:
      - name: web
        image: busybox:1.37
        command:
        - sh
        - -c
        - mkdir -p /www; echo green > /www/index.html; exec httpd -f -p 80 -h /www
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
  replicas: 1
---
apiVersion: v1
kind: Service
metadata:
  name: color
  namespace: lab-self-control
spec:
  selector:
    app: blue
  ports:
  - port: 80
    targetPort: 80
