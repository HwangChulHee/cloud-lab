apiVersion: v1
kind: Namespace
metadata:
  name: lab-daemonset
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-web
  namespace: lab-daemonset
spec:
  selector:
    matchLabels:
      app: node-web
  template:
    metadata:
      labels:
        app: node-web
    spec:
      nodeSelector:
        cloud-lab/daemonset: "yes"
      containers:
      - name: web
        image: nginx:1.28-alpine
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 5
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
