apiVersion: v1
kind: Namespace
metadata:
  name: lab-taints
---
apiVersion: v1
kind: Pod
metadata:
  name: blocked
  namespace: lab-taints
spec:
  nodeSelector:
    cloud-lab/taint-demo: "target"
  containers:
  - name: app
    image: busybox:1.37
    command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: allowed
  namespace: lab-taints
spec:
  nodeSelector:
    cloud-lab/taint-demo: "target"
  tolerations:
  - key: cloud-lab/lab31
    operator: Equal
    value: "true"
    effect: NoSchedule
  containers:
  - name: app
    image: busybox:1.37
    command: ["sleep", "3600"]
