apiVersion: v1
kind: Namespace
metadata:
  name: lab-pod-affinity
---
apiVersion: v1
kind: Pod
metadata:
  name: anchor
  namespace: lab-pod-affinity
  labels: {app: anchor}
spec:
  nodeSelector:
    cloud-lab/affinity-anchor: "yes"
  containers:
  - name: app
    image: busybox:1.37
    command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: near
  namespace: lab-pod-affinity
spec:
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels: {app: anchor}
        topologyKey: kubernetes.io/hostname
  containers:
  - name: app
    image: busybox:1.37
    command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: away
  namespace: lab-pod-affinity
spec:
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels: {app: anchor}
        topologyKey: kubernetes.io/hostname
  containers:
  - name: app
    image: busybox:1.37
    command: ["sleep", "3600"]
