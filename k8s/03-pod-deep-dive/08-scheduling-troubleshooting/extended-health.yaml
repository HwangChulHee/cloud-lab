apiVersion: apps/v1
kind: Deployment
metadata:
  name: health
  namespace: lab-self-placement
spec:
  selector:
    matchLabels:
      app: health
  template:
    metadata:
      labels:
        app: health
    spec:
      containers:
      - name: web
        image: nginx:1.28-alpine
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        command:
        - sh
        - -c
        - touch /tmp/live /tmp/ready; exec nginx -g "daemon off;"
        readinessProbe:
          exec:
            command:
            - test
            - -f
            - /tmp/ready
          periodSeconds: 3
        livenessProbe:
          exec:
            command:
            - test
            - -f
            - /tmp/live
          periodSeconds: 3
          failureThreshold: 2
        startupProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 2
          failureThreshold: 30
  replicas: 1
---
apiVersion: v1
kind: Service
metadata:
  name: health
  namespace: lab-self-placement
spec:
  selector:
    app: health
  ports:
  - port: 80
    targetPort: 80
