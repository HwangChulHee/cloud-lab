apiVersion: v1
kind: Namespace
metadata:
  name: lab-self-placement
---
apiVersion: v1
kind: Pod
metadata:
  name: best
  namespace: lab-self-placement
spec:
  containers:
  - name: app
    image: busybox:1.37
    command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: burst
  namespace: lab-self-placement
spec:
  containers:
  - name: app
    image: busybox:1.37
    command: ["sleep", "3600"]
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: guaranteed
  namespace: lab-self-placement
spec:
  containers:
  - name: app
    image: busybox:1.37
    command: ["sleep", "3600"]
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 32Mi
