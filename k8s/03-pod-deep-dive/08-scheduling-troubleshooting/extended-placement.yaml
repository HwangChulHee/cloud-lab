apiVersion: apps/v1
kind: Deployment
metadata:
  name: place
  namespace: lab-self-placement
spec:
  selector:
    matchLabels:
      app: place
  template:
    metadata:
      labels:
        app: place
    spec:
      containers:
      - name: app
        image: busybox:1.37
        command:
        - sh
        - -c
        - sleep 3600
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - REPLACE_WORKER_HOSTNAME
  replicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spread
  namespace: lab-self-placement
spec:
  selector:
    matchLabels:
      app: spread
  template:
    metadata:
      labels:
        app: spread
    spec:
      containers:
      - name: app
        image: busybox:1.37
        command:
        - sh
        - -c
        - sleep 3600
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: spread
            topologyKey: kubernetes.io/hostname
  replicas: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: near
  namespace: lab-self-placement
spec:
  replicas: 1
  selector:
    matchLabels:
      app: near
  template:
    metadata:
      labels:
        app: near
    spec:
      containers:
      - name: app
        image: busybox:1.37
        command:
        - sleep
        - '3600'
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: place
            topologyKey: kubernetes.io/hostname
