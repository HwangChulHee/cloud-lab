apiVersion: v1
kind: Namespace
metadata:
  name: lab-readiness
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lab-readiness
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
      - name: web
        image: nginx:1.28-alpine
        command: ["sh", "-c", "touch /tmp/ready; exec nginx -g 'daemon off;'"]
        readinessProbe:
          exec:
            command: ["test", "-f", "/tmp/ready"]
          periodSeconds: 3
          failureThreshold: 2
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: lab-readiness
spec:
  selector: {app: web}
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: lab-readiness
spec:
  containers:
  - name: client
    image: busybox:1.37
    command: ["sleep", "3600"]
