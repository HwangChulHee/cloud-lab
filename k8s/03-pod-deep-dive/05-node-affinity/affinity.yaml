apiVersion: v1
kind: Namespace
metadata:
  name: lab-node-affinity
---
apiVersion: v1
kind: Pod
metadata:
  name: required
  namespace: lab-node-affinity
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: cloud-lab/affinity-zone
            operator: In
            values: ["west"]
  containers:
  - name: app
    image: busybox:1.37
    command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: impossible
  namespace: lab-node-affinity
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: cloud-lab/affinity-zone
            operator: In
            values: ["missing"]
  containers:
  - name: app
    image: busybox:1.37
    command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: preferred
  namespace: lab-node-affinity
spec:
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
          - key: cloud-lab/affinity-zone
            operator: In
            values: ["missing"]
  containers:
  - name: app
    image: busybox:1.37
    command: ["sleep", "3600"]
